; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200

; List of environments
[env:5_1_adc_transfer_function]
build_src_filter = +<5_1.cpp>

[env:5_2_dac_transfer_function]
build_src_filter = +<5_2.cpp>

[env:5_3_adc_speed_hardware]
build_src_filter = +<5_3.cpp>

[env:5_4_adc_speed_software]
build_src_filter = +<5_4.cpp>

[env:5_5_dac_speed_hardware]
build_src_filter = +<5_5.cpp>

[env:5_6_dac_speed_software]
build_src_filter = +<5_6.cpp>