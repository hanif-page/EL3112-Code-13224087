; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200

; List of environments
[env:5_1]
build_src_filter = +<5_1.cpp>
; board_build.f_cpu = 240000000L  ; 240 MHz, if needed to edit from platformio.ini file

[env:5_2]
build_src_filter = +<5_2.cpp>

[env:5_3]
build_src_filter = +<5_3.cpp>

[env:5_4]
build_src_filter = +<5_4.cpp>

[env:5_5]
build_src_filter = +<5_5.cpp>

[env:5_6]
build_src_filter = +<5_6.cpp>