; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200

; List of Environments

[env:4_1_1_mac_address]
build_src_filter = +<4_1_1_mac_address.cpp>

[env:4_1_2_speed_arduino]
build_src_filter = +<4_1_2_speed_arduino.cpp>
; board_build.f_cpu = 240000000L  ; 240 MHz, if needed to edit from platformio.ini file

[env:4_1_3_speed_register]
build_src_filter = +<4_1_3_speed_register.cpp>

[env:4_1_4_latency_arduino]
build_src_filter = +<4_1_4_latency_arduino.cpp>

[env:4_1_5_latency_register]
build_src_filter = +<4_1_5_latency_register.cpp>

[env:4_1_6_relay_control]
build_src_filter = +<4_1_6_relay_control.cpp>

[env:4_1_7_freq_counter]
build_src_filter = +<4_1_7_freq_counter.cpp>